[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koryxa-service-ia-backend"
version = "0.1.0"
description = "Backend métier de KORYXA Service IA"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "structlog>=25.4,<26",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
  "httpx>=0.28,<1",
  "cryptography>=45,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "aiosqlite>=0.21,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "app.db.types",
  "app.models.registers",
  "app.schemas.registers",
  "app.services.registers",
  "app.services.files",
  "app.services.direct_uploads",
  "app.services.integration_config",
  "app.services.agents.*",
  "app.api.routes.attendance",
  "app.api.routes.automations",
  "app.api.routes.voice",
  "app.api.routes.whatsapp",
]
disable_error_code = [
  "attr-defined",
  "no-any-return",
  "no-untyped-call",
  "no-untyped-def",
  "type-arg",
]
