services:
  backend:
    build:
      context: ./backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: koryxa-services-ia-backend:${GIT_COMMIT:-latest}
    container_name: prod_koryxa_services_ia_api
    env_file:
      - ${SERVICE_IA_ENV_FILE:-/opt/env/koryxa-services-ia-backend.env}
    environment:
      SERVICE_IA_ENVIRONMENT: production
      SERVICE_IA_GIT_COMMIT: ${GIT_COMMIT:-unknown}
      SERVICE_IA_CORS_ORIGINS: '["${FRONTEND_ORIGIN:-https://service-ia.koryxa.fr}"]'
      SERVICE_IA_TRUSTED_PROXY_SOURCES: '["koryxa-gateway","koryxa-admin","koryxa-services-ia"]'
      SERVICE_IA_KNOWLIA_BASE_URL: ${KNOWLIA_BASE_URL:-http://prod_knowlia:8080}
      SERVICE_IA_FILE_STORAGE_PATH: /data/files
    volumes:
      - service_ia_files:/data/files
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
          pids: 256
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
      - public
    restart: unless-stopped

  whatsapp-bridge:
    build:
      context: ./services/whatsapp-bridge
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: koryxa-whatsapp-bridge:${GIT_COMMIT:-latest}
    container_name: koryxa-whatsapp-bridge
    env_file:
      - ${SERVICE_IA_ENV_FILE:-/opt/env/koryxa-services-ia-backend.env}
    environment:
      NODE_ENV: production
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      PORT: 8097
      BACKEND_URL: http://prod_koryxa_services_ia_api:8080
      AUDIO_ENGINE_URL: http://koryxa-audio-engine:8099
    volumes:
      - whatsapp_bridge_sessions:/app/sessions
    ports:
      - "127.0.0.1:8097:8097"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8097/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
      - public
    restart: unless-stopped

volumes:
  service_ia_files:
  whatsapp_bridge_sessions:

networks:
  internal:
    name: prod_internal
    external: true
  public:
    name: prod_public
    external: true

